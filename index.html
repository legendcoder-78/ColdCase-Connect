<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColdCase Connect | Forensic Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0B0E14] text-[#E0E0E0] font-sans selection:bg-[#00D2FF] selection:text-black">

    <!-- Sidebar Navigation -->
    <nav class="fixed left-0 top-0 h-full w-[260px] border-r border-[#2D343F] bg-[#0B0E14] z-50 flex flex-col p-6">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-10 h-10 bg-[#00D2FF] rounded-lg flex items-center justify-center">
                <i data-lucide="shield-check" class="text-black w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-mono font-bold tracking-tighter text-[#00D2FF]">COLDCASE CONNECT</h1>
        </div>

        <div class="flex-1 space-y-2">
            <a href="#" class="nav-link active flex items-center gap-3 p-3 rounded-lg text-[#00D2FF] bg-[#00D2FF]/10 transition-all">
                <i data-lucide="microscope" class="w-5 h-5"></i>
                <span>Forensic Lab</span>
            </a>
            <a href="#" class="nav-link flex items-center gap-3 p-3 rounded-lg hover:bg-white/5 transition-all">
                <i data-lucide="database" class="w-5 h-5"></i>
                <span>Case Vault</span>
            </a>
            <a href="#" class="nav-link flex items-center gap-3 p-3 rounded-lg hover:bg-white/5 transition-all">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                <span>Analytics</span>
            </a>
        </div>

        <div class="mt-auto border-t border-[#2D343F] pt-6 space-y-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#2D343F] rounded-full overflow-hidden border border-[#00D2FF]/30">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Officer" alt="Avatar">
                </div>
                <div>
                    <p class="text-sm font-bold">Officer #8001</p>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        <span class="text-[10px] text-green-500 uppercase font-bold tracking-widest">Database Linked</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Workspace -->
    <main class="ml-[260px] p-8 flex gap-8">
        
        <!-- Left: Input Zone -->
        <section class="w-1/3 flex flex-col gap-6">
            <div class="bg-[#151921] border border-[#2D343F] rounded-xl p-6 shadow-2xl">
                <h3 class="text-[#00D2FF] text-xs font-bold uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i data-lucide="file-up" class="w-4 h-4"></i> Evidence Upload
                </h3>
                
                <div id="drop-zone" class="border-2 border-dashed border-[#2D343F] rounded-xl p-8 text-center hover:border-[#00D2FF]/50 transition-all cursor-pointer relative overflow-hidden group">
                    <input type="file" id="image-input" multiple class="hidden" accept="image/*">
                    <div id="preview-container" class="hidden absolute inset-0 bg-black/80 z-10 flex items-center justify-center">
                        <img id="image-preview" src="" class="max-h-full object-contain">
                        <div id="pixel-scanner" class="absolute top-0 left-0 w-full h-[2px] bg-[#00D2FF] shadow-[0_0_15px_#00D2FF] hidden z-20"></div>
                    </div>
                    <div class="group-hover:scale-110 transition-transform">
                        <i data-lucide="image" class="w-12 h-12 mx-auto mb-4 text-[#2D343F] group-hover:text-[#00D2FF]"></i>
                        <p class="text-sm text-gray-400">Click to upload crime scene evidence</p>
                        <p class="text-[10px] text-gray-600 mt-2 uppercase font-bold">JPG, PNG supported</p>
                    </div>
                </div>

                <div class="mt-6">
                    <h3 class="text-[#00D2FF] text-xs font-bold uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="text-quote" class="w-4 h-4"></i> M.O. Narrative
                    </h3>
                    <textarea id="mo-input" class="w-full bg-[#0B0E14] border border-[#2D343F] rounded-xl p-4 text-sm h-40 focus:outline-none focus:border-[#00D2FF] transition-all" placeholder="Describe entry methods, signature patterns, or scene details..."></textarea>
                </div>

                <button id="analyze-btn" class="w-full mt-6 bg-[#00D2FF] text-black font-bold py-4 rounded-xl hover:bg-[#00b8e6] transition-all flex items-center justify-center gap-2 group">
                    <span>RUN INVESTIGATIVE ANALYSIS</span>
                    <i data-lucide="zap" class="w-5 h-5 group-hover:animate-bounce"></i>
                </button>
            </div>
        </section>

        <!-- Right: Intelligence Feed -->
        <section class="flex-1 flex flex-col gap-6">
            
            <!-- Forensic Synthesis -->
            <div id="synthesis-card" class="bg-[#151921] border border-[#2D343F] rounded-xl p-6 hidden">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-[#00D2FF] text-xs font-bold uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="bot" class="w-4 h-4"></i> AI Forensic Synthesis
                    </h3>
                    <span class="text-[10px] bg-[#00D2FF]/10 text-[#00D2FF] px-2 py-1 rounded border border-[#00D2FF]/30 font-bold">GEMINI 2.5 FLASH</span>
                </div>
                <div id="synthesis-content" class="text-sm leading-relaxed text-gray-300 font-mono italic">
                    <!-- Typing effect will go here -->
                </div>
            </div>

            <!-- Results Container -->
            <div id="results-container" class="flex flex-col gap-4">
                <div id="empty-state" class="flex flex-col items-center justify-center py-20 text-gray-600 border border-[#2D343F] border-dashed rounded-xl bg-[#151921]/50">
                    <i data-lucide="search" class="w-16 h-16 mb-4 opacity-20"></i>
                    <p class="font-bold tracking-widest text-xs uppercase">Awaiting Investigative Input</p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
